name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: dist/GeminiSpeechAPI-Setup.exe
          - os: macos-latest
            label: macOS
            asset: dist/GeminiSpeechAPI-macos.dmg
          - os: ubuntu-latest
            label: Linux
            asset: dist/GeminiSpeechAPI-linux.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libnss3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build installer
        run: python packaging/build.py

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
