[project]
name = "gemini-speech-api"
version = "1.0.3"
description = "Tray dictation using Gemini 3.5 Transcribe Live."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
build = ["pyinstaller>=6.14"]

[project.scripts]
gemini-speech-api = "gemini_speech.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gemini_speech*"]
